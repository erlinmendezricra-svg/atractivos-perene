<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - Perené</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { overflow: hidden; }
    
    .boton-volver {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      color: #006633;
      padding: 8px 15px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 100;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    
    .instrucciones {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 102, 51, 0.9);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      z-index: 100;
      text-align: center;
      font-size: 0.85rem;
    }
    
    .estado {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 100;
    }
    
    .menu-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
    
    .boton-menu {
      background: #006633;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    
    .lista-animales {
      display: none;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
      min-width: 200px;
    }
    
    .lista-animales.mostrar {
      display: block;
    }
    
    .lista-animales button {
      display: block;
      width: 100%;
      background: #f0f8f0;
      color: #006633;
      border: none;
      padding: 10px 15px;
      margin: 4px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: left;
    }
    
    .lista-animales button:hover {
      background: #d8eed8;
    }
  </style>
</head>
<body>

  <a-scene 
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;">
    
    <a-entity camera></a-entity>
    
    <!-- ✅ TAMAÑO Y POSICIÓN AJUSTADOS -->
    <a-entity
      id="animal"
      gltf-model="ar/conejo.glb"
      scale="0.5 0.5 0.5"
      position="0 -0.3 -1.5"
      visible="true"
      animation-mixer="clip: *; loop: repeat;">
    </a-entity>
    
    <a-light type="ambient" intensity="2.0"></a-light>
    <a-light type="directional" position="3 5 3" intensity="1.5"></a-light>
  </a-scene>

  <a href="index.html" class="boton-volver">← Volver</a>
  
  <div class="instrucciones">
    📱 Toca el botón y elige tu animal
  </div>
  
  <div class="estado" id="estado">✅ Cámara lista</div>
  
  <!-- 📦 MENÚ DESPLEGABLE -->
  <div class="menu-container">
    <button class="boton-menu" onclick="alternarMenu()">🐾 Elige un animal</button>
    
    <div class="lista-animales" id="listaAnimales">
      <button onclick="cambiar('ar/leona.glb'); alternarMenu();">🦁 Leona</button>
      <button onclick="cambiar('ar/cocodrilo.glb'); alternarMenu();">🐊 Cocodrilo</button>
      <button onclick="cambiar('ar/lobo.glb'); alternarMenu();">🐺 Lobo</button>
      <button onclick="cambiar('ar/saurio.glb'); alternarMenu();">🦕 Saurio</button>
      <button onclick="cambiar('ar/conejo.glb'); alternarMenu();">🐰 Conejo</button>
      <button onclick="cambiar('ar/guinea.glb'); alternarMenu();">🐹 Guinea</button>
    </div>
  </div>

  <script>
    const animal = document.getElementById('animal');
    const estado = document.getElementById('estado');
    const listaAnimales = document.getElementById('listaAnimales');
    
    // 🔄 Abrir/cerrar menú
    function alternarMenu() {
      listaAnimales.classList.toggle('mostrar');
    }
    
    // 🔄 Cerrar menú si tocas fuera
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.menu-container')) {
        listaAnimales.classList.remove('mostrar');
      }
    });
    
    animal.addEventListener('model-loaded', () => {
      estado.textContent = '✅ ¡Animal listo y animado!';
      estado.style.background = 'green';
    });
    
    animal.addEventListener('model-error', () => {
      estado.textContent = '❌ Error al cargar';
      estado.style.background = 'red';
    });
    
    function cambiar(ruta) {
      const nombre = ruta.split('/').pop().replace('.glb', '');
      estado.textContent = '⏳ Cargando: ' + nombre;
      
      animal.setAttribute('gltf-model', '');
      
      setTimeout(() => {
        animal.setAttribute('gltf-model', ruta);
        animal.setAttribute('scale', '0.5 0.5 0.5');
        animal.setAttribute('position', '0 -0.3 -1.5');
      }, 150);
    }
  </script>

</body>
</html>
