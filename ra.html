<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - Perené</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { overflow: hidden; }
    
    .boton-volver {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      color: #006633;
      padding: 8px 15px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 100;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    
    .instrucciones {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 102, 51, 0.9);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      z-index: 100;
      text-align: center;
      font-size: 0.85rem;
      max-width: 95%;
    }
    
    .selector-modelo {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      padding: 15px 20px;
      border-radius: 12px;
      z-index: 100;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    
    .selector-modelo h3 {
      color: #006633;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    
    .selector-modelo button {
      background: #006633;
      color: white;
      border: none;
      padding: 10px 14px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
    
    .estado {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 100;
    }
  </style>
</head>
<body>

  <a-scene 
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;">
    
    <a-entity camera></a-entity>
    
    <!-- ✅ TAMAÑO: 0.8 0.8 0.8 para todos los animales -->
    <a-entity
      id="animal"
      gltf-model="ar/conejo.glb"
      scale="0.8 0.8 0.8"
      position="0 0 -2"
      visible="true"
      animation-mixer="clip: *; loop: repeat;">
    </a-entity>
    
    <a-light type="ambient" intensity="2.0"></a-light>
    <a-light type="directional" position="3 5 3" intensity="1.5"></a-light>
  </a-scene>

  <a href="index.html" class="boton-volver">← Volver</a>
  
  <div class="instrucciones">
    📱 Elige un animal → ¡se moverá por ti!
  </div>
  
  <div class="estado" id="estado">✅ Cámara lista</div>
  
  <div class="selector-modelo">
    <h3>Elige un animal 🐾</h3>
    <button onclick="cambiar('ar/leona.glb')">🦁 Leona</button>
    <button onclick="cambiar('ar/cocodrilo.glb')">🐊 Cocodrilo</button>
    <button onclick="cambiar('ar/lobo.glb')">🐺 Lobo</button>
    <button onclick="cambiar('ar/saurio.glb')">🦕 Saurio</button>
    <button onclick="cambiar('ar/conejo.glb')">🐰 Conejo</button>
  </div>

  <script>
    const animal = document.getElementById('animal');
    const estado = document.getElementById('estado');
    
    animal.addEventListener('model-loaded', () => {
      estado.textContent = '✅ ¡Animal listo y animado!';
      estado.style.background = 'green';
    });
    
    animal.addEventListener('model-error', () => {
      estado.textContent = '❌ Error al cargar';
      estado.style.background = 'red';
    });
    
    function cambiar(ruta) {
      const nombre = ruta.split('/').pop().replace('.glb', '');
      estado.textContent = '⏳ Cargando: ' + nombre;
      
      animal.setAttribute('gltf-model', '');
      
      setTimeout(() => {
        animal.setAttribute('gltf-model', ruta);
        animal.setAttribute('scale', '0.8 0.8 0.8'); // ✅ Mantiene tamaño siempre
      }, 150);
    }
  </script>

</body>
</html>
