<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { overflow: hidden; }
    
    .boton-volver {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      color: #006633;
      padding: 8px 15px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 100;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    
    .consejo {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      z-index: 100;
      line-height: 1.4;
    }
    
    .controles-tamano {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 100;
    }
    
    .controles-tamano button {
      background: white;
      color: #006633;
      border: 2px solid #006633;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    
    .controles-tamano button:active {
      background: #006633;
      color: white;
    }
    
    .menu-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
    
    .boton-menu {
      background: #006633;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    
    .lista-animales {
      display: none;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
      min-width: 200px;
    }
    
    .lista-animales.mostrar {
      display: block;
    }
    
    .lista-animales button {
      display: block;
      width: 100%;
      background: #f0f8f0;
      color: #006633;
      border: none;
      padding: 10px 15px;
      margin: 4px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: left;
    }
    
    .lista-animales button:hover {
      background: #d8eed8;
    }
  </style>
</head>
<body>

  <a-scene 
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;">
    
    <a-entity camera></a-entity>
    
    <!-- ✅ TAMAÑO INICIAL MÁS PEQUEÑO -->
    <a-entity
      id="animal"
      gltf-model="ar/conejo.glb"
      scale="0.4 0.4 0.4"
      position="0 -0.3 -1.5"
      visible="true"
      animation-mixer="clip: *; loop: repeat;">
    </a-entity>
    
    <a-light type="ambient" intensity="2.5"></a-light>
    <a-light type="directional" position="5 8 5" intensity="2.0"></a-light>
    <a-light type="directional" position="-5 5 -5" intensity="1.2" color="#fff9e6"></a-light>
  </a-scene>

  <a href="index.html" class="boton-volver">← Volver</a>
  
  <div class="consejo">
    ➕ Agrandar<br>
    ➖ Achicar más<br>
    👆 Arrastra para mover
  </div>
  
  <div class="controles-tamano">
    <button onclick="achicar()">➖</button>
    <button onclick="agrandar()">➕</button>
  </div>
  
  <div class="menu-container">
    <button class="boton-menu" onclick="alternarMenu()">🐾 Elige un animal</button>
    
    <div class="lista-animales" id="listaAnimales">
      <button onclick="cambiar('ar/leona.glb'); alternarMenu();">🦁 Leona</button>
      <button onclick="cambiar('ar/cocodrilo.glb'); alternarMenu();">🐊 Cocodrilo</button>
      <button onclick="cambiar('ar/lobo.glb'); alternarMenu();">🐺 Lobo</button>
      <button onclick="cambiar('ar/saurio.glb'); alternarMenu();">🦕 Saurio</button>
      <button onclick="cambiar('ar/conejo.glb'); alternarMenu();">🐰 Conejo</button>
      <button onclick="cambiar('ar/guinea.glb'); alternarMenu();">🐹 Guinea</button>
    </div>
  </div>

  <script>
    const animal = document.getElementById('animal');
    const listaAnimales = document.getElementById('listaAnimales');
    
    // ✅ TAMAÑO AJUSTADO: empieza más pequeño y se puede achicar más
    let tamanoActual = 0.4;
    const paso = 0.05;
    const minTamano = 0.1;
    const maxTamano = 1.5;
    
    function achicar() {
      if (tamanoActual > minTamano) {
        tamanoActual -= paso;
        animal.setAttribute('scale', `${tamanoActual} ${tamanoActual} ${tamanoActual}`);
      }
    }
    
    function agrandar() {
      if (tamanoActual < maxTamano) {
        tamanoActual += paso;
        animal.setAttribute('scale', `${tamanoActual} ${tamanoActual} ${tamanoActual}`);
      }
    }
    
    function alternarMenu() {
      listaAnimales.classList.toggle('mostrar');
    }
    
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.menu-container')) {
        listaAnimales.classList.remove('mostrar');
      }
    });
    
    function cambiar(ruta) {
      animal.setAttribute('gltf-model', '');
      tamanoActual = 0.4;
      
      setTimeout(() => {
        animal.setAttribute('gltf-model', ruta);
        animal.setAttribute('scale', '0.4 0.4 0.4');
        animal.setAttribute('position', '0 -0.3 -1.5');
      }, 150);
    }
    
    let tocando = false;
    let ultimoX = 0;
    let ultimoY = 0;
    let posX = 0;
    let posY = -0.3;
    
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        tocando = true;
        ultimoX = e.touches[0].clientX;
        ultimoY = e.touches[0].clientY;
      }
    });
    
    document.addEventListener('touchmove', function(e) {
      if (tocando && e.touches.length === 1) {
        e.preventDefault();
        const dx = (e.touches[0].clientX - ultimoX) / 300;
        const dy = (e.touches[0].clientY - ultimoY) / 300;
        
        posX += dx;
        posY -= dy;
        
        animal.setAttribute('position', `${posX} ${posY} -1.5`);
        
        ultimoX = e.touches[0].clientX;
        ultimoY = e.touches[0].clientY;
      }
    });
    
    document.addEventListener('touchend', function() {
      tocando = false;
    });
  </script>

</body>
</html>
